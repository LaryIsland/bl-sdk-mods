[project]
name = "ShieldRechargeTimer"
version = "2.0"
authors = [{ name = "LaryIsland" }]
description = """\
Displays a configurable timer on your HUD that counts the seconds before your shield starts to recharge.\
"""

[project.urls]
Source = "https://github.com/LaryIsland/bl-sdk-mods/tree/main/ShieldRechargeTimer"
Changelog = "https://github.com/LaryIsland/bl-sdk-mods/blob/main/ShieldRechargeTimer/README.md"
Issues = "https://github.com/LaryIsland/bl-sdk-mods/issues"

[tool.sdkmod]
name = "Shield Recharge Timer"
supported_games = ["BL2", "TPS"]
license = { name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
download = "https://github.com/LaryIsland/bl-sdk-mods/raw/main/ShieldRechargeTimer/ShieldRechargeTimer.sdkmod"
