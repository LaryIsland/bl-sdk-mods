[project]
name = "MeleeEnhancement"
version = "2.0"
authors = [{ name = "LaryIsland" }]
description = """\
A few tweaks to Zer0 and Krieg to enhance their melee gameplay.

Zer0: Fearless increases shield recharge delay, and Kunai no longer inflict self damage.

Krieg: Silence the Voices self-hit chance scales down, and Buzz Axe Bombadier causes slag explosions.\
"""

[project.urls]
Source = "https://github.com/LaryIsland/bl-sdk-mods/tree/main/MeleeEnhancement"
Changelog = "https://github.com/LaryIsland/bl-sdk-mods/blob/main/MeleeEnhancement/README.md"
Issues = "https://github.com/LaryIsland/bl-sdk-mods/issues"

[tool.sdkmod]
name = "Melee Enhancement"
supported_games = ["BL2"]
license = { name = "MIT", url = "https://choosealicense.com/licenses/mit/" }
download = "https://github.com/LaryIsland/bl-sdk-mods/raw/main/MeleeEnhancement/MeleeEnhancement.sdkmod"
